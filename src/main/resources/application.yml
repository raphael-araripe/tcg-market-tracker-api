server:
  port: 8081

spring:
  application:
    name: tcg-market-tracker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcg_tracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' ensures Hibernate ONLY checks if tables match Entities, leaving creation strictly to Flyway!
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cardtrader:
    base-url: ${CARDTRADER_API_URL:https://api.cardtrader.com/api/v2}
    token: ${CARDTRADER_TOKEN:}